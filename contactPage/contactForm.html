<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="./contact.css" />
    <title>Contact Us || HNG13</title>
</head>

<body>
    <header>
        <nav class="nav">
            <h1 class="logo" data-testid="test-logo">Mo.</h1>
            <ul class="nav__links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/aboutPage/about.html">About Me</a></li>
                <li><a href="./contactPage/form.html" aria-current="page">Contact</a></li>
            </ul>

        </nav>
    </header>

    <main data-testid="test-contact-page">
        <article class="contact-card">
            <header>
                <h1>Contact Us</h1>
                <p class="subtitle">We’d love to hear from you! 💬</p>
            </header>

            <form id="contactForm" novalidate>
                <!-- Full Name -->
                <div class="form-group">
                    <div class="form-desc"><label for="name">Full Name</label>
                        <p class="error" id="error-name" data-testid="test-contact-error-name"></p>
                    </div>

                    <input type="text" id="name" name="name" required data-testid="test-contact-name"
                        aria-describedby="error-name" />
                </div>

                <!-- Email -->
                <div class="form-group">
                    <div class="form-desc">
                        <label for="email">Email</label>
                        <p class="error" id="error-email" data-testid="test-contact-error-email"></p>
                    </div>

                    <input type="email" id="email" name="email" required data-testid="test-contact-email"
                        aria-describedby="error-email" />
                </div>

                <!-- Subject -->
                <div class="form-group">
                    <div class="form-desc">
                        <label for="subject">Subject</label>
                        <p class="error" id="error-subject" data-testid="test-contact-error-subject"></p>
                    </div>

                    <input type="text" id="subject" name="subject" required data-testid="test-contact-subject"
                        aria-describedby="error-subject" />

                </div>

                <!-- Message -->
                <div class="form-group">
                    <div class="form-desc">
                        <label for="message">Message</label>
                        <p class="error" id="error-message" data-testid="test-contact-error-message"></p>
                    </div>
                    <textarea id="message" name="message" rows="5" required data-testid="test-contact-message"
                        aria-describedby="error-message"></textarea>
                </div>

                <button type="submit" data-testid="test-contact-submit">Send Message</button>
                <p class="success-message" data-testid="test-contact-success"></p>
            </form>

            <footer>
                <a href="../index.html" class="back-link">← Back to Profile</a>
            </footer>
        </article>
    </main>

    <script src="./contact.js"></script>
</body>

</html>
